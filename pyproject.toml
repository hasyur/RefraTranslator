[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "RefraTranslator"
dynamic = ["version"]
description = "RefraTranslator: real-time Windows game screen translation with a local LLM API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "setuptools>=80",
  "build>=1.2,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]
ocr-gpu = [
  "paddleocr>=3.3,<4",
  "paddlepaddle-gpu>=3.3.1,<3.4",
  "paddlex[ocr-core]>=3.7.2,<3.8",
]
gui = [
  "PySide6>=6.9,<6.10",
  "dxcam[winrt]>=0.3,<0.4",
]

[project.scripts]
refra-translator = "game_screen_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "game_screen_translator._version.__version__"}

[tool.setuptools.package-data]
"game_screen_translator.gui" = [
  "qml/*.qml",
  "qml/shared/*.qml",
  "qml/skins/prism/*.qml",
  "qml/skins/prism/components/*.qml",
  "qml/skins/prism/pages/*.qml",
  "qml/skins/prism/assets/*.png",
  "qml/skins/dohna/*.qml",
  "qml/skins/dohna/components/*.qml",
  "qml/skins/dohna/pages/*.qml",
  "qml/skins/dohna/assets/*.png",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires the explicitly enabled local LLM service",
]
