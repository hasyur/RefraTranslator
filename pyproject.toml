[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "RefraTranslator"
version = "0.1.0"
description = "RefraTranslator: real-time Windows game screen translation with a local LLM API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]
ocr = [
  "paddleocr>=3.3,<4",
  "paddlepaddle>=3.2,<4",
]
ocr-gpu = [
  "paddleocr>=3.3,<4",
  "paddlepaddle-gpu>=3.3.1,<3.4",
]
gui = [
  "PySide6>=6.9,<6.10",
  "dxcam>=0.3,<0.4",
]

[project.scripts]
refra-translator = "game_screen_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires the explicitly enabled local LLM service",
]
