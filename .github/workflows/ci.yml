name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev,gui]"

      - name: Check dependency consistency
        run: |
          python -m pip check
          python packaging/release_metadata.py --check

      - name: Parse PowerShell installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          $script = "bootstrap.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "$script`: $($_.Message)" }
            exit 1
          }

      - name: Run offline tests
        run: python -m pytest -m "not integration"

      - name: Build source and wheel distributions
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install build
          python -m build

  installer:
    name: Windows installer and isolated startup
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up release Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-core.txt

      - name: Check release metadata
        run: python packaging/release_metadata.py --check

      - name: Install the fixed application runtime
        run: |
          python -m pip install -r packaging/requirements-core.txt
          python -m pip check

      - name: Prepare pinned build tools
        shell: pwsh
        run: |
          $toolsRoot = Join-Path $env:RUNNER_TEMP "refra-build-tools"
          New-Item -ItemType Directory -Force -Path $toolsRoot | Out-Null
          $embedZip = Join-Path $toolsRoot "python-3.13.5-embed-amd64.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.13.5/python-3.13.5-embed-amd64.zip" -OutFile $embedZip
          if ((Get-FileHash -LiteralPath $embedZip -Algorithm SHA256).Hash -ne "7d2650fd9d1b9d002d4a315d5f354247fd6a44f30517c7ef577b08f57a0fb6d9") {
            throw "CPython archive checksum mismatch"
          }
          $innoSetup = Join-Path $toolsRoot "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $innoSetup
          if ((Get-FileHash -LiteralPath $innoSetup -Algorithm SHA256).Hash -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") {
            throw "Inno Setup archive checksum mismatch"
          }
          $innoDir = Join-Path $toolsRoot "inno"
          $toolInstall = Start-Process -FilePath $innoSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$innoDir`"") -WindowStyle Hidden -Wait -PassThru
          if ($toolInstall.ExitCode -ne 0) { throw "Inno Setup install failed: $($toolInstall.ExitCode)" }
          "REFRA_BUILD_TOOLS=$toolsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build both Windows installers
        shell: pwsh
        run: |
          python packaging/build_windows_installer.py `
            --iscc "$env:REFRA_BUILD_TOOLS\inno\ISCC.exe" `
            --python-embed "$env:REFRA_BUILD_TOOLS\python-3.13.5-embed-amd64.zip"

      - name: Install and start in isolation
        run: python packaging/verify_windows_install.py --installer dist/windows-installer/RefraTranslator-Portable-Smoke.exe

      - name: Save installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-validation
          path: |
            build/windows-installer/build-report.json
            build/windows-install-validation/**/verification-report.json
            build/windows-install-validation/**/*.log
          if-no-files-found: ignore
