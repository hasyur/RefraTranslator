[translation]
provider = "openai_compatible"
# external 使用用户自己的 OpenAI-compatible API；builtin 使用程序管理的本地模型。
backend = "external"
# 切换后端不会覆盖下面的外部 API 地址、模型或 API Key。
builtin_model = "Hy-MT2-1.8B-Q8_0.gguf"
# follow_ocr 跟随 OCR；也可以独立指定 gpu:0、gpu:1 等单张物理显卡。
builtin_cuda_device = "follow_ocr"
# 内置 llama.cpp 的服务槽位数；每槽固定 2048，上下文总量为 2048 × 槽位数。
builtin_parallel = 1
# f16 更稳妥；q8_0 可以降低长上下文的 KV 显存占用。
builtin_kv_cache_type = "f16"
# 0.2 偏稳定；Hy-MT2 官方推荐值为 0.7。
builtin_temperature = 0.2
base_url = "http://127.0.0.1:1234/v1"
model = "hy-mt1.5-7b"
# 可在启动器中填写；非空值会明文保存在本机 config.toml（该文件已被 Git 忽略）。
api_key = ""
# api_key 留空时从这个环境变量读取；兼容旧变量 GAME_SCREEN_TRANSLATOR_API_KEY。
api_key_env = "REFRA_TRANSLATOR_API_KEY"
target_language = "简体中文"
timeout_seconds = 5.0
# 同时发送的翻译批次数；还需要 LLM 后端允许相应并发。
max_concurrency = 2
temperature = 0.7
top_p = 0.6
max_output_tokens = 2048

[ocr]
language = "japan"
min_score = 0.60
cache_dir = ".cache/paddlex"
detection_model = "PP-OCRv6_small_det"
recognition_model = "PP-OCRv6_small_rec"
model_source = "bos"
# 仅支持 NVIDIA GPU；例如第二张显卡使用 gpu:1。
device = "gpu:0"
# 整屏输入会在检测阶段等比缩小，OCR 坐标仍会还原到原始画面。
detection_max_side = 1280
# OCR 后、稳定跟踪和 LLM 前过滤图标、数字及非源语言文字；也可在启动器中切换。
text_filter_enabled = true
# 将换行句子和日文竖排碎片整理成翻译块；关闭后保留 PaddleOCR 原始文字框。
text_merge_enabled = true
# 仅对局部断链、候选边胜负过近、菜单/句子冲突三个严格歧义条件调用 LLM；失败沿用规则结果。
text_merge_llm_arbitration_enabled = true
# 保留英文文本；关闭后可以进一步排除英文桌面图标和游戏 UI。
translate_latin = true
# 日文与中文的纯汉字文本无法可靠区分，默认跳过；需要翻译「開始」等内容时开启。
translate_han_only = false

[preview]
# 正数是最低模糊半径；程序还会按文字框高度自动提高到 8～18px。
blur_radius = 8.0
# 0.55 为“黑化模糊”；0.0 为不叠黑的“仅模糊”。
overlay_opacity = 0.55
font_path = ""

[recording]
# 启用后，实时翻译进程会在本机提供透明 OBS Browser Source。
browser_overlay_enabled = false
# 服务只监听 127.0.0.1；默认地址为 http://127.0.0.1:47831/overlay。
browser_overlay_port = 47831

[profiles]
# 每个游戏各占一个子目录，其中包含术语表和 SQLite 翻译缓存。
root_dir = "profiles"

[live]
# 相对于所选显示器左上角的捕获区域；width/height 为 0 表示延伸至显示器边缘。
left = 0
top = 0
width = 0
height = 0
monitor_index = 0
# 屏幕捕获频率自动为 change_poll_fps 的 2 倍（默认 12 FPS）。
# 两条调度路径共用的轻量变化检测频率；动态 ROI 开启时即热图频率。
change_poll_fps = 6
change_threshold = 3.0
stable_observations = 1
stable_ms = 0
clear_after_ms = 900
context_pairs = 8
max_batch_size = 8
capture_backend = "dxgi"
# 实验性路径：首次整帧 OCR 后，以 change_poll_fps 热图定位变化。
# 动态背景目前可能频繁触发整帧安全回退，默认保持关闭。
dynamic_roi_enabled = false
# 动态 ROI 会分别学习局部/整帧 OCR 的提交后成本，并用剩余预算合并变化。
# 这是期望目标，不包含 LLM 翻译；机器本身达不到时会立即提交 OCR。
dynamic_roi_response_target_ms = 500
# 旧版 dynamic_roi_settle_ms / dynamic_roi_ocr_interval_ms /
# dynamic_roi_max_coalesce_ms 仍可加载，但新调度器不再使用。
# 以下三项只用于关闭动态 ROI 时的旧全帧调度路径。
# 每次 OCR 完成后的额外休息时间；0 优先避免短字幕被跳过。
ocr_cooldown_ms = 0
# 画面变化停止后再确认一次，避免首帧处于字幕绘制中途或 OCR 偶发漏检；0 可关闭。
settle_rescan_ms = 500
# 静止画面的低频兜底复查，避免小范围变化未过阈值后永久漏译；0 可关闭。
idle_rescan_ms = 2000
